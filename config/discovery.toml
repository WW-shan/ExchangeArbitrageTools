leg_mode = 'serial'
max_open_batches = 1
daily_max_loss_usd = "5"
handoff_max_age_ms = 15000
ioc_venues = []
fok_venues = []

[database]
path = "data/discovery.sqlite"

[api]
host = "127.0.0.1"
port = 8789

[bsc]
enabled = false
primary_provider = "0x"
backup_provider = "1inch"
token_symbols = ["CAKE", "BNB", "USDT", "USDC"]
bnb_usd = "600"
slippage_bps = 10
inventory_mode = true
estimated_transfer_arrival_ms = 900000
max_transfer_arrival_ms = 1800000

