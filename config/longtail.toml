# Read-only low-liquidity discovery profile.
#
# The scanner script uses the volume band below to build the intersection of
# Gate.io and Hotcoin markets. Fees are placeholders and must be replaced with
# the real account tier before any profit conclusion. This profile never
# enables live execution.

[scanner]
enabled_venues = ['gateio', 'hotcoin']
quote_currency = 'USDT'
quote_currencies = ['USDT']
# Kept for config compatibility. scan-longtail.ts always uses the low-volume
# intersection and the --min-volume/--max-volume arguments.
asset_universe_mode = 'top_volume'
max_base_assets = 200
min_24h_quote_volume_usd = '1000'
max_24h_quote_volume_usd = '500000'
universe_refresh_ms = 900000
base_assets = []
scan_interval_hot_ms = 30000
scan_interval_top100_ms = 120000
scan_interval_top500_ms = 600000
signal_cooldown_ms = 60000
fetch_concurrency = 4
max_order_notional = '100'
max_orderbook_age_ms = 10000
max_feed_latency_ms = 10000
max_freeze_ms = 15000
feed_mode = 'rest'
ws_max_book_age_ms = 10000
ws_max_subscriptions = 200
ws_max_reconnect_attempts = 5
ws_rest_fallback_per_venue = 4
ws_scan_interval_ms = 1000
orderbook_depth = 20
min_net_profit_bps = 5
safety_buffer_bps = 2
min_profit_usd = '0.01'
max_slippage_bps = 30
max_gas_cost_usd = '0.50'
max_transfer_tax_bps = 0
max_pair_skew_ms = 5000
min_reliability_score = '0'
max_price_deviation_bps = 500
suspicious_spread_bps = 200
rebalance_cost_bps = 0
execution_mode = 'taker_taker'
maker_fill_probability = '0.5'
optimal_sizing = true
min_sizing_notional = '0.5'
sizing_step = '0.01'
max_sizing_candidates_per_cycle = 40
sizing_samples = 16
persist_snapshots = false
scan_interval_ms = 5000
fee_file = 'data/fees.json'
max_triangular_paths = 0
max_candidates_per_cycle = 20
max_hops = 3
max_legs_per_currency = 2
cross_venue_mode = 'off'
max_venue_switches = 1
balance_max_age_ms = 300000
require_balances_for_s1 = false
min_top_depth_qty = '0'
liquidity_top_levels = 5

[execution]
live_enabled = false
kill_switch = true
manual_confirmation = true
# serial or parallel_fok; low-liquidity scans do not enable either live path.
leg_mode = 'serial'
max_open_batches = 1
daily_max_loss_usd = '5'
handoff_max_age_ms = 15000
ioc_venues = []
fok_venues = []

[database]
path = 'data/longtail.sqlite'

[api]
host = '127.0.0.1'
port = 8790

[bsc]
enabled = false
primary_provider = '0x'
backup_provider = '1inch'
token_symbols = ['CAKE', 'BNB', 'USDT', 'USDC']
bnb_usd = '600'
slippage_bps = 10
inventory_mode = true
estimated_transfer_arrival_ms = 900000
max_transfer_arrival_ms = 1800000

# Verified gross account fees on 2026-10-28. The rebate is applied as a separate
# step, so per-symbol account fees from data/fees.json remain gross as well.
[fees.gateio]
taker_bps = 9.9
maker_bps = 9.9
rebate_pct = 70

[fees.hotcoin]
taker_bps = 20
maker_bps = 20
rebate_pct = 80
