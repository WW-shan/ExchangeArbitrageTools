# Two-sided S1 inventory rotation plan. The runtime profile is
# config/live-rotation.toml; this file records the selected research candidate.

as_of = '2026-10-29'
mode = 'two_sided_inventory_rotation'
auto_execution = true

[[pairs]]
base = 'LIGHT'
quote = 'USDT'
priority = 1
starting_notional_usd = '10'
max_notional_usd = '20'

[[pairs]]
base = 'KAT'
quote = 'USDT'
priority = 3
starting_notional_usd = '10'
max_notional_usd = '20'

[[pairs]]
base = 'TBK'
quote = 'USDT'
priority = 2
starting_notional_usd = 'existing inventory'
max_notional_usd = '20'

[[watch_only]]
base = 'KAT'
quote = 'USDT'
reason = 'reserve only; no funded side yet'

[rotation_rules]
max_open_batches = 1
entry_requires_fresh_books = true
entry_requires_balance_refresh = true
automatic_confirmation_after_seed = true
