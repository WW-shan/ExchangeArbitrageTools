# Two-sided S1 rotation profile: LIGHT primary, TBK secondary with existing
# inventory, small automatic batches. The manual CLI remains available; --auto
# uses the persisted automatic gate.

[scanner]
# Hotcoin minimums are per symbol. The executor enforces market.minNotional.
enabled_venues = ['gateio', 'hotcoin']
quote_currency = "USDT"
# Keep the first live batch narrow. Use config/discovery.toml for read-only
# volume-ranked opportunity discovery.
asset_universe_mode = "explicit"
base_assets = ["LIGHT", "TBK"]
quote_currencies = ["USDT"]
max_base_assets = 2
fetch_concurrency = 4
scan_interval_hot_ms = 30000
scan_interval_top100_ms = 120000
scan_interval_top500_ms = 600000
signal_cooldown_ms = 60000
max_order_notional = "20"
# Low-liquidity books can legitimately go 2-15 seconds without a new exchange
# update. Keep received-at/WebSocket freshness separate from this window; the
# executor re-fetches both books and uses FOK before submitting.
max_orderbook_age_ms = 20000
max_feed_latency_ms = 20000
max_freeze_ms = 10000
feed_mode = 'websocket'
ws_max_book_age_ms = 5000
ws_max_subscriptions = 200
# After this many consecutive failures, keep retrying at ws_reconnect_max_ms.
ws_max_reconnect_attempts = 5
ws_rest_fallback_per_venue = 4
ws_scan_interval_ms = 1000
orderbook_depth = 20
min_net_profit_bps = 5
safety_buffer_bps = 2
min_profit_usd = "0.01"
max_slippage_bps = 30
max_gas_cost_usd = "0.50"
max_transfer_tax_bps = 0
max_pair_skew_ms = 5000
min_reliability_score = '0.3'
max_price_deviation_bps = 1000
suspicious_spread_bps = 1000
# Keep near-breakeven negative edges so the reversion-preparation path can see
# them. The calibration has 5 and 12 bps bands, so the floor must cover the
# widest band. The normal S1 entry threshold remains 5 bps; this only changes
# which books reach the full evaluator.
prefilter_floor_bps = -12
rebalance_cost_bps = 0
execution_mode = 'taker_taker'
maker_fill_probability = '0.5'
optimal_sizing = true
min_sizing_notional = "3"
sizing_step = "0.01"
max_sizing_candidates_per_cycle = 20
sizing_samples = 12
persist_snapshots = true
scan_interval_ms = 5000
fee_file = 'data/fees.json'
max_triangular_paths = 0
max_candidates_per_cycle = 20
max_hops = 3
max_legs_per_currency = 2
cross_venue_mode = "off"
max_venue_switches = 1
balance_max_age_ms = 300000
require_balances_for_s1 = true
min_top_depth_qty = "0"
liquidity_top_levels = 5

[execution]
live_enabled = true
kill_switch = false
manual_confirmation = true
# serial = buy leg, reconcile, then sell leg.
# parallel_fok = submit both FOK legs concurrently. It is still NOT atomic
# across venues. Keep serial until both private FOK paths are verified.
leg_mode = 'serial'
max_open_batches = 1
daily_max_loss_usd = "5"
handoff_max_age_ms = 15000
ioc_venues = []
fok_venues = ['gateio', 'hotcoin']

[auto_rotation]
# Manual handoff remains available. This supervisor is the separate, explicit
# automatic path and still requires live_enabled=true and a released kill switch.
enabled = true
poll_interval_ms = 1000
balance_refresh_ms = 5000
max_signal_age_ms = 10000
cooldown_ms = 0
max_consecutive_failures = 3
heartbeat_file = 'data/rotation-executor.heartbeat.json'

# When the funded direction converges to near breakeven, a small preparation
# trade may shift inventory to the other side. It is a bounded inventory shift,
# not a promise that the reverse spread returns. The 2026-10-29 calibration
# allows TBK gate->hotcoin in the 5 bps band and TBK hotcoin->gate in the 12 bps
# band; LIGHT remains negative in both bands.
[auto_rotation.preparation]
enabled = true
max_notional = '10'
min_stable_ms = 30000
# No daily preparation count/cost cap and no preparation cooldown. Every new
# opportunity still has to pass the fresh calibration and expected-value gate;
# the allowed cost is the calibration's break-even cost, not a fixed cap.
# Generated by:
#   npm run backtest:history -- --prep --bases LIGHT,TBK ...
# A direction without a calibration row is never prepared.
calibration_file = 'config/s1-prep-calibration.json'
min_reverse_probability = '0.55'
min_expected_value_bps = '0'
min_expected_value_usd = '0'
max_hold_ms = 3600000

[[auto_rotation.pairs]]
base = 'LIGHT'
quote = 'USDT'
max_notional = '20'

[[auto_rotation.pairs]]
base = 'TBK'
quote = 'USDT'
max_notional = '20'

[transfers]
enabled = false
require_manual_confirmation = true
release_mode = 'manual'
max_in_flight_batches = 1
max_legs_per_batch = 2
max_balance_age_ms = 300000
poll_interval_ms = 15000
withdrawal_timeout_ms = 900000
deposit_timeout_ms = 1800000
min_net_edge_bps = '5'
max_cost_usd = '0.5'
max_arrival_ms = 1800000
# Keep this section closed until both venues expose the exact asset/network
# and explicit withdrawal credentials. The withdrawal key may reuse the trade
# key, but that increases the blast radius; IP whitelist attestation is still
# required. The first live test must use one leg only.
# Gate's 2026-10-28 currency data shows INC on ERC20 only and TBK/HTX on TRC20
# only; CAKE/ETH/USDT are available on BSC/BEP20. Do not assume INC/BSC.
# Add explicit [[transfers.allowlist]] entries for each direction, for example:
# [[transfers.allowlist]]
# from_venue = 'gateio'
# to_venue = 'hotcoin'
# asset = 'CAKE'
# network = 'BSC'
# address = '0x...'
# address_tag = ''
# min_amount = '15'
# max_amount = '200'
# daily_max_amount = '400'
# withdraw_fee = '1'

[account_status]
# Verify authentication, Gate account identity/IP/pair whitelists and the
# Hotcoin balance read every minute. Gate/Hotcoin do not expose the current
# key's trade/withdraw permission bits, so those are reported as UNKNOWN.
# A shared trade/withdrawal key is allowed per operator policy and audited.
enabled = true
refresh_ms = 60000
stale_ms = 180000
# Gate currently has no IP whitelist on this account. Keep this false after the
# operator explicitly accepted the shared-key blast radius; set true after an
# IP whitelist is configured in both exchange backends.
require_ip_whitelist = false
allow_shared_trade_withdrawal_key = true
block_on_ip_whitelist_change = true
block_on_account_id_change = true
block_on_account_mode_change = true

[database]
path = "data/rotation.sqlite"

[api]
host = "127.0.0.1"
port = 8789

[bsc]
enabled = false
primary_provider = "0x"
backup_provider = "1inch"
token_symbols = ["CAKE", "BNB", "USDT", "USDC"]
bnb_usd = "600"
slippage_bps = 10
inventory_mode = true
estimated_transfer_arrival_ms = 900000
max_transfer_arrival_ms = 1800000

# Fee values are GROSS account rates before commission rebate. Effective fee =
# gross_bps x (1 - rebate_pct / 100). Account rates from data/fees.json are
# also gross, so rerunning `npm run fees:fetch` keeps the rebate effective.
# Negative maker_bps means the venue pays the maker. Do not enable live until
# both venues have explicit taker fees and the rebates are confirmed in the UI.
[fees.gateio]
# Gate personal trading fee API: 9.9 bps gross on 2026-10-28.
# Operator-confirmed 70% spot rebate -> 2.97 bps effective.
taker_bps = 9.9
maker_bps = 9.9
rebate_pct = 70

[fees.hotcoin]
# Hotcoin official VIP0 spot schedule: maker 0.20%, taker 0.20%.
# Source: https://www.hotcoin.com/en_US/rateStandard/index (2026-10-28).
# Operator-confirmed 80% spot rebate -> 4 bps effective.
taker_bps = 20
maker_bps = 20
rebate_pct = 80

# 2026-10-28 private probes verified the no-fill path on both venues:
# - Gate.io returned FOK_NOT_FILL with zero fill and unchanged balance.
# - Hotcoin matchType=8 accepted the order, then exposed no order and no frozen
#   balance; the executor now confirms such IOC/FOK misses from pre-submit and
#   post-submit balances before closing the batch.
# Keep IOC empty: only the FOK path has been verified end-to-end on both venues.
