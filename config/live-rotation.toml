# WARD-only S1 rotation profile for Gate.io and Bitget.
# Inventory is intentionally single-sided at the start: the venue that holds
# WARD sells it while the other venue buys with USDT. A filled S1 naturally
# flips the inventory to the other side, so both venues do not need to hold
# WARD at the same time. The manual CLI remains available; --auto uses the
# persisted automatic gate.

[scanner]
# Gate.io and Bitget are the only enabled execution venues.
enabled_venues = ['gateio', 'bitget']
monitor_only_venues = []
quote_currency = "USDT"
# Keep the first live batch narrow. Use config/discovery.toml for read-only
# volume-ranked opportunity discovery.
asset_universe_mode = "explicit"
# WARD is the only live candidate. The 6-day 1m Gate/Bitget backtest showed
# the highest repeatable executable frequency and the deepest two-sided book.
base_assets = ["WARD"]
quote_currencies = ["USDT"]
max_base_assets = 1
fetch_concurrency = 4
scan_interval_hot_ms = 30000
scan_interval_top100_ms = 120000
scan_interval_top500_ms = 600000
signal_cooldown_ms = 60000
# 0 = no fixed cap: size from the limiting live balance and visible depth.
max_order_notional = "0"
# Low-liquidity books can legitimately go 2-15 seconds without a new exchange
# update. Keep received-at/WebSocket freshness separate from this window; the
# executor re-fetches both books and uses FOK before submitting.
max_orderbook_age_ms = 20000
max_feed_latency_ms = 20000
max_freeze_ms = 10000
feed_mode = 'websocket'
ws_max_book_age_ms = 5000
ws_max_subscriptions = 200
# After this many consecutive failures, keep retrying at ws_reconnect_max_ms.
ws_max_reconnect_attempts = 5
ws_rest_fallback_per_venue = 4
ws_scan_interval_ms = 100
orderbook_depth = 20
min_net_profit_bps = 5
safety_buffer_bps = 2
min_profit_usd = "0.005"
max_slippage_bps = 30
max_gas_cost_usd = "0.50"
max_transfer_tax_bps = 0
max_pair_skew_ms = 5000
min_reliability_score = '0.3'
max_price_deviation_bps = 1000
suspicious_spread_bps = 1000
# Spike ("dislocation") channel.
#
# S1 compares two venues against each other and rejects anything above
# suspicious_spread_bps as a broken book. A spike is a different event: one
# venue moves away from its own trailing median while the other stays on
# baseline. Measured 2026-11-19, IR/USDT printed 1,213 bps for 3.3 minutes and
# produced zero S1 signals.
#
# DISLOCATION signals are written to the same opportunities table and go
# through the same two-leg state machine, so every execution safeguard still
# applies. They are only executable for bases that are also whitelisted in
# [[auto_rotation.pairs]]; everything else is recorded and ignored by the
# executor.
#
# WARD itself has never produced a spike in 25h of recorded books: of 672
# strict cross-venue joins, 0 samples reached 300 bps. Enabling this channel
# on WARD alone adds detection, not trades. Add a pair to run the channel for
# real.
dislocation_enabled = true
dislocation_min_bps = 500
dislocation_min_venue_deviation_bps = 300
dislocation_max_counter_deviation_bps = 150
dislocation_baseline_window_ms = 300000
dislocation_baseline_capacity = 61
dislocation_min_baseline_samples = 5
# Gate's minimum executable notional is 3 USDT; below it the signal cannot be
# filled even when the spread is enormous.
dislocation_min_notional_usd = "3"
# WARD/KAT preparation calibration is not generated yet, so keep the normal S1
# floor until a fresh calibration exists.
prefilter_floor_bps = -2

# Reject an S1 sell leg whose resting bid has kept the same price AND size for
# this many milliseconds. 0 disables the check.
#
# This is the guard that was missing, and it is measured in TIME, not scans:
# the hot path re-evaluates roughly every 100 ms, so an 8-scan threshold is
# about one second, not the forty seconds its name implies.
#
# What it catches: 2026-11-18 15:53 -> 2026-11-19 05:38, Bitget WARD showed
# the same 12391.31 WARD bid at 0.001676 for over 13 hours while the ask kept
# moving. 26 S1 executions priced against that bid, 26 filled zero, one
# unhedged position, kill switch. Price-only checks cannot see it; the resting
# order fingerprint (price + size) can.
#
# 20 s is far above the p95 of profitable signals (2.7 s) and far below the
# 13-hour staleness that actually lost money. Rejecting a stale bid costs
# nothing; accepting it costs a full position.
s1_max_bid_still_ms = 20000
rebalance_cost_bps = 0
execution_mode = 'taker_taker'
maker_fill_probability = '0.5'
optimal_sizing = true
min_sizing_notional = "3"
sizing_step = "0.01"
max_sizing_candidates_per_cycle = 20
sizing_samples = 12
persist_snapshots = true
scan_interval_ms = 5000
fee_file = 'data/fees.json'
max_triangular_paths = 0
max_candidates_per_cycle = 20
max_hops = 3
max_legs_per_currency = 2
cross_venue_mode = "off"
max_venue_switches = 1
balance_max_age_ms = 300000
require_balances_for_s1 = true
# Reserve 1% of the limiting balance for preflight price movement and fees.
# Without this, a full-balance signal can safe-stop as sell_base_balance_insufficient.
balance_safety_buffer_bps = 100
# Keep a buy-side USDT reserve on every executable venue. The scanner will not
# size an S1 buy that would consume this reserve. The current account is tiny,
# so the reserve is 0.5 USDT and the minimum executable leg is 3 USDT (Gate's
# minimum notional); a 5 USDT reserve made every minimum-size buy unfunded.
min_buy_quote_reserve_usd = '0.5'
min_top_depth_qty = "0"
liquidity_top_levels = 5

[execution]
live_enabled = true
kill_switch = false
manual_confirmation = true
# serial = buy first, then re-fetch the sell book and hedge only the filled
# quantity. Measured on real WARD fills (2026-11-18): parallel FOK left one
# side exposed on 41% of signals, and the follow-up hedge lost 0.039 USDT per
# failure against 0.040 USDT of median profit. Serial buy-first turns a failed
# buy into a harmless retry instead of a forced hedge.
# Do not switch back to parallel without A/B data showing a higher fill rate.
leg_mode = 'serial'
# Leg 1 is already filled once we get here, so the base asset is sitting on the
# venue. Not selling it is not "avoiding a loss" - it is keeping an open
# position the strategy never sized. Measured 2026-11-18: 27 buys filled, only
# 1 sell filled, and the day's S1 result was -2.54 USDT because 26 stops left
# inventory behind. The sell leg now always runs; this ceiling is the only
# thing that still stops it, and it must be a real loss limit, not a profit
# test. At 0.5 USDT it is ~7% of a 7 USDT batch - large enough to exit a moved
# book, small enough to catch a collapse.
max_post_fill_exit_loss_usd = "0.5"
# Gate/Bitget allow well above ten requests per second. The hot path issues the
# balance and open-order checks in parallel, so 10 RPS avoids serializing them
# behind a conservative limiter while staying below the venue soft limits.
requests_per_second = 10
max_open_batches = 1
daily_max_loss_usd = "5"
handoff_max_age_ms = 15000
ioc_venues = []
fok_venues = ['gateio', 'bitget']

[auto_rotation]
# Manual handoff remains available. This supervisor is the separate, explicit
# automatic path and still requires live_enabled=true and a released kill switch.
enabled = true
# Poll the signal store frequently; balance refresh is parallelized and no
# longer blocks the execution loop for the whole refresh interval.
poll_interval_ms = 50
# Keep the process-local preflight cache warm without blocking the signal loop.
# The hot path reads these snapshots directly; REST is only a fallback.
balance_refresh_ms = 1000
preflight_balance_max_age_ms = 3000
preflight_open_order_max_age_ms = 3000
preflight_hot_book_max_age_ms = 3000
# Keep the signal window wider than the measured private-API preflight while
# still bounding total decay. Timing on the live account showed several signals
# whose refreshed books were still profitable at 2.5-3.2 seconds, but were
# rejected only because the 2.5 s budget was too tight. FOK still prevents a
# resting order, and the executor re-evaluates both fresh books before submit.
max_signal_age_ms = 5000
max_preflight_ms = 4000
cooldown_ms = 0
max_consecutive_failures = 3
heartbeat_file = 'data/rotation-executor.heartbeat.json'

# Preparation is disabled until a WARD-specific calibration is generated.
# The old LIGHT/TBK/KAT calibration must not be reused.
[auto_rotation.preparation]
enabled = false
max_notional = '5'
min_stable_ms = 30000
# No daily preparation count/cost cap and no preparation cooldown. Every new
# opportunity still has to pass the fresh calibration and expected-value gate;
# the allowed cost is the calibration's break-even cost, not a fixed cap.
# Generated by:
#   npm run backtest:history -- --prep --bases LIGHT,TBK ...
# A direction without a calibration row is never prepared.
calibration_file = 'config/s1-prep-calibration.json'
min_reverse_probability = '0.55'
min_expected_value_bps = '0'
min_expected_value_usd = '0'
max_hold_ms = 3600000

# After a confirmed one-leg SAFE_STOP, attempt one reduce-only FOK flatten.
# Unknown orders never reach this path. The hedge may realize up to 1 USDT
# of loss to remove inventory risk; anything worse stays SAFE_STOP for manual
# review. The kill switch remains on after the hedge, so no new rotation starts.
[auto_rotation.residual_hedge]
enabled = true
max_loss_usd = '1'
max_baseline_age_ms = 60000
# The flatten path always pulls its own fresh REST book, so judge it by that
# fetch (book_max_age_ms) rather than the scanner's 20s low-liquidity window.
# book_max_exchange_age_ms bounds the venue's own last-update stamp separately:
# an illiquid book with an old print is still tradable against, and refusing it
# leaves the position naked until a human notices.
book_max_age_ms = 3000
book_max_exchange_age_ms = 300000
max_attempts = 3
retry_delay_ms = 400

# Seed only the missing side and only after a fresh directional S1 signal.
# When both sides lack useful inventory, buy the cheaper ask. When one side
# already has inventory, top up the missing side only if it is cheaper or
# within 30 bps of the other ask. This is signal-driven preparation, not a
# standing instruction to hold WARD on both venues. Every seed is a separate
# SEED execution, not arbitrage profit, and unknown/partial orders stop the
# executor.

# WARD cannot move between venues (Bitget's minimum withdrawal equals our whole
# position), so a stopped S1 can only be completed from inventory that is
# already on the other venue. Without this the hedge flattens on the venue that
# filled leg 1, and on 2026-11-18 that meant selling Gate at 0.001649 while
# Bitget bid 0.001676 - a 96 bps loss on a batch whose leg 2 had simply not
# filled. Turning this on lets the hedge sell the counterparty's own WARD,
# which is the only way a two-venue inventory rotation can work when transfer
# is impossible. It never sells more than that venue holds for free.
allow_counterparty_hedge = true
[auto_rotation.inventory]
enabled = true
# 0 means prepare the missing side with all spendable quote after the reserve.
seed_notional_usd = '0'
# Minimum USDT that must remain available after the buy leg on each venue. This
# is also passed to the scanner and executor as a hard post-trade reserve.
min_quote_reserve_usd = '0.5'
# The rebalancer restores reserve + this amount when pair.max_notional is a
# positive cap. With max_notional = 0 the amount is ignored and the full base
# surplus is converted to quote.
min_executable_buy_usd = '3'
min_useful_notional_usd = '3'
min_stable_ms = 3000
max_pair_deviation_bps = '30'
max_price_drift_bps = '100'
check_interval_ms = 1000
retry_cooldown_ms = 60000
# If a fresh positive S1 signal needs USDT on the buy venue and that venue has
# excess base, sell only enough base to restore the buy reserve. The sale must
# leave at least min_useful_notional_usd of base for the sell leg and must stay
# below the configured one-time cost ceiling.
rebalance_enabled = true
max_rebalance_loss_usd = '0.25'
# A funding sale must also leave at least half of the target opportunity's
# conservative profit after the rebalance cost. This prevents a signal with a
# large gross spread from consuming its entire edge in inventory conversion.
max_rebalance_cost_fraction = '0.5'
min_rebalance_edge_bps = '50'
rebalance_signal_max_age_ms = 5000
# Do not build inventory for a pair unless there is a fresh directional S1
# signal. Without this, the supervisor seeds every pair in rotation and can
# spread the tiny shared USDT balance across unrelated base assets.
require_signal_for_seed = true

[[auto_rotation.pairs]]
base = 'WARD'
quote = 'USDT'
venues = ['gateio', 'bitget']
max_notional = '0'

# 2026-10-29 live check: Gate/Bitget WARD withdraw=false; Bitget KAT
# withdraw=false. WARD/KAT have no two-way transfer route. See
# docs/s1-transfer-route-check-2026-10-29.md before enabling this section.
[transfers]
enabled = false
require_manual_confirmation = true
release_mode = 'manual'
max_in_flight_batches = 1
max_legs_per_batch = 2
max_balance_age_ms = 300000
poll_interval_ms = 15000
withdrawal_timeout_ms = 900000
deposit_timeout_ms = 1800000
min_net_edge_bps = '5'
max_cost_usd = '0.5'
max_arrival_ms = 1800000
# Keep this section closed until both venues expose the exact asset/network
# and explicit withdrawal credentials. The withdrawal key may reuse the trade
# key, but that increases the blast radius; IP whitelist attestation is still
# required. The first live test must use one leg only.
# Gate's 2026-10-28 currency data shows INC on ERC20 only and TBK/HTX on TRC20
# only; CAKE/ETH/USDT are available on BSC/BEP20. Do not assume INC/BSC.
# Add explicit [[transfers.allowlist]] entries for each direction, for example:
# [[transfers.allowlist]]
# from_venue = 'gateio'
# to_venue = 'hotcoin'
# asset = 'CAKE'
# network = 'BSC'
# address = '0x...'
# address_tag = ''
# min_amount = '15'
# max_amount = '200'
# daily_max_amount = '400'
# withdraw_fee = '1'

[account_status]
# Verify authentication, Gate account identity/IP/pair whitelists and the
# Hotcoin balance read every five minutes. Gate/Hotcoin do not expose the current
# key's trade/withdraw permission bits, so those are reported as UNKNOWN.
# A shared trade/withdrawal key is allowed per operator policy and audited.
enabled = true
# Account permission checks are comparatively slow private calls. Keep them
# frequent enough to detect permission changes, but out of the 250ms hot path.
refresh_ms = 300000
stale_ms = 900000
# Gate currently has no IP whitelist on this account. Keep this false after the
# operator explicitly accepted the shared-key blast radius; set true after an
# IP whitelist is configured in both exchange backends.
require_ip_whitelist = false
allow_shared_trade_withdrawal_key = true
block_on_ip_whitelist_change = true
block_on_account_id_change = true
block_on_account_mode_change = true

# Fee values are GROSS before rebate: effective = gross * (1 - rebate_pct/100).
# Bitget: operator-confirmed 80% spot rebate -> 2 bps effective. Without it the
# round trip pays 12.97 bps instead of 4.97, which turns a 60 bps spread into a loss.
[fees.weex]
taker_bps = 10
maker_bps = 10
rebate_pct = 0

[fees.bitget]
taker_bps = 10
maker_bps = 10
rebate_pct = 80

[database]
path = "data/rotation.sqlite"

[api]
host = "127.0.0.1"
port = 8789

[bsc]
enabled = false
primary_provider = "0x"
backup_provider = "1inch"
token_symbols = ["CAKE", "BNB", "USDT", "USDC"]
bnb_usd = "600"
slippage_bps = 10
inventory_mode = true
estimated_transfer_arrival_ms = 900000
max_transfer_arrival_ms = 1800000

# Fee values are GROSS account rates before commission rebate. Effective fee =
# gross_bps x (1 - rebate_pct / 100). Account rates from data/fees.json are
# also gross, so rerunning `npm run fees:fetch` keeps the rebate effective.
# Negative maker_bps means the venue pays the maker. Do not enable live until
# both venues have explicit taker fees and the rebates are confirmed in the UI.
[fees.gateio]
# Gate personal trading fee API: 9.9 bps gross on 2026-10-28.
# Operator-confirmed 70% spot rebate -> 2.97 bps effective.
taker_bps = 9.9
maker_bps = 9.9
rebate_pct = 70

[fees.hotcoin]
# Hotcoin official VIP0 spot schedule: maker 0.20%, taker 0.20%.
# Source: https://www.hotcoin.com/en_US/rateStandard/index (2026-10-28).
# Operator-confirmed 80% spot rebate -> 4 bps effective.
taker_bps = 20
maker_bps = 20
rebate_pct = 80

# 2026-10-28 private probes verified the no-fill path on both venues:
# - Gate.io returned FOK_NOT_FILL with zero fill and unchanged balance.
# - Hotcoin matchType=8 accepted the order, then exposed no order and no frozen
#   balance; the executor now confirms such IOC/FOK misses from pre-submit and
#   post-submit balances before closing the batch.
# Keep IOC empty: only the FOK path has been verified end-to-end on both venues.

